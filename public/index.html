<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- App description — shown in link previews, browser tabs, search -->
    <meta name="description" content="Moodify — Pick your mood, feel the music. A mood-based music player that plays the perfect playlist for how you feel." />

    <!-- Open Graph — shown when sharing on WhatsApp, iMessage, Twitter etc -->
    <meta property="og:title"       content="Moodify" />
    <meta property="og:description" content="Pick your mood, feel the music." />
    <meta property="og:image"       content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:type"        content="website" />

    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Moodify" />
    <meta name="twitter:description" content="Pick your mood, feel the music." />
    <meta name="twitter:image"       content="%PUBLIC_URL%/og-image.png" />

    <!-- PWA icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Moodify — Feel the Music</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Moodify.</noscript>
    <div id="root"></div>
  </body>
</html>
